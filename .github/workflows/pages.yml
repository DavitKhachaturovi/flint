# The website flintnotes.app (WEB-01, D-162): `site/` published by GitHub Pages (source "GitHub
# Actions" in the repository's Pages settings) on pushes to `next` or `main` that touch it (Davit,
# 10 Nov 2026: the site goes live ahead of the release it describes; the app still releases from
# `main` only, D-145), or by hand. The `github-pages` environment allows both branches. Static
# files only: no build, no dependencies. The custom domain is set in the Pages settings (and
# `site/CNAME`). Actions are pinned by commit SHA (the tag in the comment).
name: Pages

on:
  push:
    branches: [next, main]
    # The version and the release notes too: the hero's "Latest release" line comes from them (D-184).
    paths:
      [
        'site/**',
        '.github/workflows/pages.yml',
        'scripts/site-release.mjs',
        'apps/desktop/package.json',
        'docs/release-notes.md',
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The hero's "Latest release" line, from apps/desktop/package.json and docs/release-notes.md
      # (D-184): plain Node, no dependencies (the runner's own Node).
      - name: Latest release line
        run: node scripts/site-release.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
