# Flint CI (docs/05 §6, D-136): pushes to `next` and pull requests, on Windows like the app.
# D-150: not on `main` or tags: a release commit is `next`'s green commit fast-forwarded, so one run
# covers it (release.yml checks CI by commit SHA, whatever the branch).
# D-145: the end-to-end tests are split across parallel runners (Playwright --shard), so a full run
# takes minutes; CI green on a commit is the release gate (release.yml checks it).
# Actions are pinned by commit SHA (the tag in the comment); update them deliberately.
name: CI

on:
  push:
    branches: [next]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node from .node-version (24.22.1+, D-30); npm ci follows .npmrc (engine-strict, min-release-age).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: npm audit (fails on high or critical)
        run: npm run audit

      - name: Release-age check (7-day cooldown, D-30)
        run: node scripts/check-release-age.mjs

      - name: Embedded-Node check (Electron must embed Node >= 24.22.1, D-30)
        run: npm run check:electron-node

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
        env:
          # Deeper fuzzing than local runs (the file format, shorthand, undo).
          FLINT_FUZZ_RUNS: '10000'

  e2e:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      # Every shard runs to the end, so one run shows every failure.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: End-to-end tests, shard ${{ matrix.shard }} of 4 (Electron, zero network requests)
        run: npm run test:e2e -w @flint/desktop -- --shard=${{ matrix.shard }}/4
        env:
          # D-137: the performance checks are advisory on CI agents, strict locally.
          FLINT_CI: '1'

      - name: Keep the end-to-end results (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: apps/desktop/test-results
          retention-days: 14
