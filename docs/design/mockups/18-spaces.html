<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spaces — Flint mockup (D-189: concept 1 chosen)</title>
<!-- Tokens and fonts from the repository itself: no network request (APP-09, D-60). -->
<link rel="stylesheet" href="../tokens.css">
<style>
@font-face{font-family:'Onest';src:url('../../../apps/desktop/src/renderer/fonts/Onest-Variable.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block}
@font-face{font-family:'Geist Mono';src:url('../../../apps/desktop/src/renderer/fonts/GeistMono-Variable.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block}
@font-face{font-family:'FiraGO';src:url('../../../apps/desktop/src/renderer/fonts/FiraGO-Regular.woff2') format('woff2');font-weight:400;unicode-range:U+10A0-10FF,U+1C90-1CBF,U+2D00-2D2F}

/* ── The page around the window (not the app) ───────────────────────────── */
body{margin:0;background:color-mix(in srgb,var(--fl-ground-window),black 45%);font-family:var(--fl-font-ui);color:var(--fl-text-primary);font-size:14px}
.stage{width:1600px;margin:0 auto;padding-bottom:40px}
.stage *{box-sizing:border-box}
:where(.stage button){font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default}
.switcher{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 0 4px}
.switcher .line{display:flex;align-items:flex-start;gap:12px;max-width:1560px}
.switcher .lab{flex:0 0 64px;padding-top:9px;text-align:right;font-size:12.5px;color:var(--fl-text-muted)}
.tabs{display:flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:12px;background:var(--fl-ground-card);box-shadow:inset 0 0 0 1px var(--fl-edge-card)}
.tabs button{height:28px;padding:0 10px;border-radius:9px;color:var(--fl-text-muted);font-size:12.5px;white-space:nowrap;transition:background-color var(--fl-dur-fast),color var(--fl-dur-fast)}
.tabs button:hover{color:var(--fl-text-primary)}
.tabs button.on{background:var(--fl-strong-bg);color:var(--fl-strong-fg);font-weight:500}
.tabs button .pick{margin-left:6px;font-family:var(--fl-font-mono);font-size:10px;letter-spacing:.04em;opacity:.7}
.sim{height:28px;padding:0 12px;border-radius:9px;font-size:12.5px;color:var(--fl-text-secondary);box-shadow:inset 0 0 0 1px var(--fl-edge-card)}
.sim:hover{color:var(--fl-text-primary);background:var(--fl-ground-hover)}
.caption{min-height:46px;display:flex;align-items:center;justify-content:center;padding:6px 80px;font-size:12.5px;line-height:1.5;color:var(--fl-text-muted);text-align:center}
.caption b{color:var(--fl-text-primary);font-weight:500}
.notes{margin:18px 0 0;padding:22px 26px;border-radius:var(--fl-radius-card);background:var(--fl-ground-card);box-shadow:var(--fl-shadow-card);display:grid;grid-template-columns:1fr 1fr;gap:6px 44px;font-size:12.5px;line-height:1.6;color:var(--fl-text-secondary)}
.notes h2{grid-column:1/-1;margin:0 0 4px;font-size:16px;font-weight:600;color:var(--fl-text-highlight)}
.notes h3{margin:12px 0 4px;font-size:11px;font-weight:400;letter-spacing:.07em;text-transform:uppercase;color:var(--fl-text-faint)}
.notes p{margin:0 0 6px}
.notes ul{margin:0;padding-left:16px}
.notes li{margin:3px 0}
.notes b{color:var(--fl-text-primary);font-weight:500}
.notes code{font-family:var(--fl-font-mono);font-size:11.5px;color:var(--fl-text-primary)}
.notes .full{grid-column:1/-1}

/* ── The window ─────────────────────────────────────────────────────────── */
.win{position:relative;width:1600px;height:1020px;display:flex;overflow:hidden;background:var(--fl-ground-window);border-radius:8px;box-shadow:0 0 0 1px var(--fl-edge-card)}
.caps{position:absolute;right:0;top:0;height:40px;display:flex;align-items:center;color:var(--fl-text-faint);z-index:4}
.caps span{width:46px;display:flex;justify-content:center}
.tbtns{position:absolute;right:146px;top:6px;display:flex;gap:4px;z-index:4}
.tbtns span{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--fl-text-faint)}

/* Sidebar (app.css .sidebar, .nav, .tile, .nav-group, .sidebar-foot) */
.sidebar{flex:0 0 236px;display:flex;flex-direction:column;gap:3px;padding:14px 12px;background:var(--fl-ground-sidebar);border-right:1px solid var(--fl-edge-divider);position:relative;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 20px;font-weight:600;font-size:17px;letter-spacing:-.01em;color:var(--fl-text-primary)}
.brand img{width:34px;height:34px;display:block}
.brand .search{margin-left:auto;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--fl-text-faint)}
.nav{position:relative;display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px 7px 7px;border-radius:var(--fl-radius-row);text-align:left;font-size:14px;transition:background-color var(--fl-dur-fast),box-shadow var(--fl-dur-fast)}
.nav:hover{background:var(--fl-ground-hover)}
.nav.on{background:var(--fl-ground-float);box-shadow:var(--fl-shadow-selected)}
.nav.on .nav-name{color:var(--fl-text-highlight);font-weight:500}
.nav.on .tile{background:var(--fl-strong-bg);color:var(--fl-strong-fg);box-shadow:var(--fl-shadow-strong-tile)}
.nav.ctx{background:var(--fl-ground-hover);box-shadow:inset 0 0 0 1px var(--fl-edge-chip)}
.nav-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fl-text-heading-soft)}
.nav-count{font-family:var(--fl-font-mono);font-size:var(--fl-size-meta);color:var(--fl-text-faint)}
.nav.quick .nav-name,.nav.quick .tile{color:var(--fl-text-muted)}
.tile{width:26px;height:26px;flex:0 0 auto;border-radius:var(--fl-radius-tile);display:flex;align-items:center;justify-content:center;background:var(--fl-ground-tile);box-shadow:inset 0 0 0 1px var(--fl-edge-chip);color:var(--fl-text-heading-soft)}
.tile svg{display:block}
.cl{display:flex;color:var(--fl-text-secondary);position:relative}
.section-label{display:flex;align-items:center;gap:4px;padding:20px 2px 6px 10px;font-size:var(--fl-size-label);letter-spacing:.07em;text-transform:uppercase;color:var(--fl-text-faint)}
.section-label .grow{flex:1}
.nav-group{margin:2px 0;padding:3px;border-radius:14px;background:var(--fl-ground-card);box-shadow:0 0 0 1px var(--fl-edge-divider),inset 0 1px 0 color-mix(in srgb,var(--fl-text-highlight) 3%,transparent)}
.nav-group-head{display:flex;align-items:center;gap:6px;width:100%;padding:7px 10px 3px 6px;font-size:var(--fl-size-label);letter-spacing:.07em;text-transform:uppercase;color:var(--fl-text-faint)}
.nav-group-head .g{flex:1}
.nav-group-head .nav-count{letter-spacing:0}
.nav-group-head .chev{display:flex;transform:rotate(90deg);color:var(--fl-text-faint)}
.nav-group .nav{padding-left:15px}
.sidebar-foot{margin-top:auto;display:flex;gap:6px;padding-top:12px;position:relative;background:var(--fl-ground-sidebar)}
.sidebar-foot::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:32px;background:linear-gradient(to bottom,transparent,var(--fl-ground-sidebar));pointer-events:none}
.sidebar-foot .nav{flex:1 1 0;height:36px;justify-content:center;gap:6px;padding:0 8px;border-radius:12px;background:var(--fl-ground-card);box-shadow:0 0 0 1px var(--fl-edge-card)}
.sidebar-foot .nav.on{background:var(--fl-ground-float);box-shadow:0 0 0 1px var(--fl-edge-float),var(--fl-shadow-selected)}
.sidebar-foot .nav.on .tile{background:var(--fl-ground-tile);color:var(--fl-text-highlight);box-shadow:inset 0 0 0 1px var(--fl-edge-chip)}
.sidebar-foot .tile{width:22px;height:22px}
.sidebar-foot .nav-name{flex:0 1 auto;font-size:13px}

/* ── New: the space line and the space switcher (Proposed) ──────────────── */
.space-line{height:1px;flex:0 0 auto;margin:14px 4px 8px;background:var(--fl-edge-divider)}
.space-head{display:flex;align-items:center;gap:2px;min-height:34px;animation:none}
.space-head.morph .space-btn > *{animation:sh-in var(--fl-dur-state) ease}
@keyframes sh-in{from{opacity:0;transform:translateY(2px)}}
.space-btn{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0;height:34px;padding:0 8px 0 4px;border-radius:10px;text-align:left;transition:background-color var(--fl-dur-fast),box-shadow var(--fl-dur-fast)}
.space-btn:hover{background:var(--fl-ground-hover)}
.space-btn.open{background:var(--fl-ground-tile);box-shadow:inset 0 0 0 1px var(--fl-edge-chip)}
.stile{width:22px;height:22px;flex:0 0 auto;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--fl-ground-tile);box-shadow:inset 0 0 0 1px var(--fl-edge-chip);color:var(--fl-text-primary);font-size:11.5px;font-weight:600;line-height:1}
.stile.l{width:30px;height:30px;border-radius:9px;font-size:14px}
.stile.xl{width:38px;height:38px;border-radius:11px;font-size:16px}
.stile.tpop,.space-head .space-btn > .stile.tpop{animation:tile-pop var(--fl-dur-state) var(--fl-ease-press)}
@keyframes tile-pop{40%{transform:scale(1.12)}}
.space-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:600;color:var(--fl-text-primary)}
.space-chev{position:relative;display:flex;color:var(--fl-text-faint)}
.att-dot{position:absolute;right:-6px;top:-3px;width:5px;height:5px;border-radius:50%;background:var(--fl-overdue-dot)}
.tool{position:relative;width:26px;height:26px;flex:0 0 auto;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--fl-text-secondary)}
.tool:hover{background:var(--fl-ground-hover);color:var(--fl-text-primary)}
.tool .att-dot{right:2px;top:4px}
.people{display:flex;align-items:center;gap:8px;width:100%;margin:0 0 4px;padding:4px 8px 4px 6px;border-radius:9px;text-align:left;font-size:12px;color:var(--fl-text-muted);transition:background-color var(--fl-dur-fast),color var(--fl-dur-fast)}
.people:hover,.people.open{background:var(--fl-ground-hover);color:var(--fl-text-secondary)}
.people.gone{color:var(--fl-text-faint)}
.people-slot{overflow:hidden}
.people-slot.in{animation:fold-in var(--fl-dur-state) ease}
@keyframes fold-in{from{opacity:0;max-height:0}to{max-height:40px}}
.discs{display:flex;flex:0 0 auto}
.disc{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:600;background:var(--fl-ground-tile);box-shadow:0 0 0 1.5px var(--fl-ground-sidebar),inset 0 0 0 1px var(--fl-edge-chip);color:var(--fl-text-secondary)}
.disc + .disc{margin-left:-4px}
.disc.l{width:26px;height:26px;font-size:11.5px;box-shadow:inset 0 0 0 1px var(--fl-edge-chip)}
.disc.you{background:var(--fl-strong-bg);color:var(--fl-strong-fg);box-shadow:none}
.space-stage{position:relative;display:flex;flex-direction:column}
.space-body{display:flex;flex-direction:column;gap:3px}
.space-body.out{position:absolute;top:0;left:0;right:0;pointer-events:none;animation:sb-out 180ms ease forwards}
.space-body.in{animation:sb-in var(--fl-dur-page) cubic-bezier(.2,.9,.3,1)}
@keyframes sb-out{to{opacity:0;transform:translateX(var(--dx))}}
@keyframes sb-in{from{opacity:0;transform:translateX(var(--dx))}}
.empty-space{padding:10px 10px 4px;font-size:12.5px;line-height:1.5;color:var(--fl-text-faint)}
.fl-flash{animation:fl-flash 1100ms ease-out}
@keyframes fl-flash{0%,35%{background:var(--fl-ground-tile)}}
.mm{width:15px;height:15px;flex:0 0 auto;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;background:var(--fl-ground-float);box-shadow:inset 0 0 0 1px var(--fl-edge-float);font-family:var(--fl-font-ui);font-size:9px;font-weight:600;line-height:1;color:var(--fl-text-primary)}
.mm{transition:background-color var(--fl-dur-fast),color var(--fl-dur-fast),box-shadow var(--fl-dur-fast)}
.main .mm[data-sp]:hover{background:var(--fl-strong-bg);color:var(--fl-strong-fg);box-shadow:var(--fl-shadow-strong-tile)}
.mm.press{animation:mm-press var(--fl-dur-state) var(--fl-ease-press)}
@keyframes mm-press{30%{transform:scale(.82)}}
.tip{position:absolute;z-index:90;pointer-events:none;display:flex;flex-direction:column;gap:2px;padding:6px 9px;border-radius:8px;background:var(--fl-ground-float);box-shadow:var(--fl-shadow-float);font-size:12px;color:var(--fl-text-primary);white-space:nowrap;animation:tip-fade var(--fl-dur-fast) ease-out}
.tip .k{font-size:11px;color:var(--fl-text-muted)}
@keyframes tip-fade{from{opacity:0;transform:translateY(2px)}}
.kc{min-width:18px;height:18px;padding:0 5px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:var(--fl-ground-tile);box-shadow:inset 0 0 0 1px var(--fl-edge-chip);font-family:var(--fl-font-mono);font-size:10.5px;color:var(--fl-text-secondary)}

/* Main area */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.titlebar{flex:0 0 40px}
.scroller{flex:1;min-height:0;overflow:hidden}
.pair{display:flex;justify-content:center;align-items:flex-start;gap:28px;padding:8px 24px 0}
.content{flex:0 0 820px;display:flex;flex-direction:column;gap:16px}
.content.in{animation:page-in var(--fl-dur-page) cubic-bezier(.2,.9,.3,1)}
@keyframes page-in{from{opacity:0;transform:translateY(8px)}}
.tcol{flex:0 0 440px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--fl-ground-card);border-radius:var(--fl-radius-card);box-shadow:var(--fl-shadow-card)}
.lhead{display:flex;flex-direction:column;gap:6px;padding:0 4px 2px}
.ltitle{margin:0;font-size:var(--fl-size-title);font-weight:700;letter-spacing:-.025em;color:var(--fl-text-heading-soft);line-height:1.2}
.ltitle b{color:var(--fl-text-highlight);font-weight:700}
.lsub{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--fl-text-secondary)}
.lsub .cl{color:var(--fl-text-secondary)}
.composer{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 18px}
.composer .ph{flex:1;font-size:14px;color:var(--fl-text-faint)}
.composer .tools{display:flex;gap:4px;color:var(--fl-text-muted)}
.composer .tools span{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.send{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--fl-ground-tile);box-shadow:inset 0 0 0 1px var(--fl-edge-chip);color:var(--fl-text-muted)}
.rows{padding:6px;display:flex;flex-direction:column;gap:2px}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:42px;padding:9px 12px 9px 16px;border-radius:var(--fl-radius-row);font-size:var(--fl-size-body);color:var(--fl-text-body)}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.done{color:var(--fl-text-faint)}
.row.sel{background:var(--fl-ground-float);box-shadow:var(--fl-shadow-selected)}
.stripe{position:absolute;left:3px;top:11px;bottom:11px;border-radius:3px}
.stripe.h{width:var(--fl-pri-high-width);background:var(--fl-pri-high-color)}
.stripe.m{width:var(--fl-pri-med-width);background:var(--fl-pri-med-color)}
.stripe.l{width:var(--fl-pri-low-width);background:var(--fl-pri-low-color)}
.check{width:20px;height:20px;flex:0 0 auto;border-radius:var(--fl-radius-check);border:1.5px solid var(--fl-checkbox-border)}
.check.done{display:flex;align-items:center;justify-content:center;border:0;background:var(--fl-accent);color:var(--fl-strong-fg)}
.ind{display:flex;align-items:center;gap:8px;color:var(--fl-text-muted);font-family:var(--fl-font-mono);font-size:12px;white-space:nowrap}
.ind .p{display:flex;color:var(--fl-text-faint)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:var(--fl-radius-check);background:var(--fl-ground-tile);box-shadow:inset 0 0 0 1px var(--fl-edge-chip);font-family:var(--fl-font-mono);font-size:11.5px;color:var(--fl-text-secondary);white-space:nowrap;flex:0 0 auto}
.chip.s{height:22px;padding:0 7px;font-size:11px}
.slabel{padding:14px 18px 4px;font-size:var(--fl-size-label);letter-spacing:.07em;text-transform:uppercase;color:var(--fl-text-faint)}
.completed{display:flex;align-items:center;gap:8px;padding:12px 18px;font-size:13px;color:var(--fl-text-muted)}

/* Today (mockup 12) */
.greet{font-size:var(--fl-size-greeting);font-weight:700;letter-spacing:-.03em;line-height:1.12;color:var(--fl-text-heading-soft)}
.greet b{color:var(--fl-text-highlight);font-weight:700}
.dateline{display:flex;align-items:center;gap:14px;font-size:13.5px;color:var(--fl-text-secondary)}
.track{width:240px;height:6px;border-radius:var(--fl-radius-pill);background:var(--fl-ground-tile);box-shadow:inset 0 0 0 1px var(--fl-edge-chip);overflow:hidden}
.track i{display:block;height:100%;background:var(--fl-strong-bg);border-radius:var(--fl-radius-pill)}
.mono{font-family:var(--fl-font-mono)}
.rgrid{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:12px}
.rem{padding:14px 16px;border-radius:16px;background:var(--fl-ground-card);box-shadow:var(--fl-shadow-card-close);display:flex;flex-direction:column;gap:8px;min-width:0}
.rem.next{background:var(--fl-ground-float);box-shadow:var(--fl-shadow-card-hover)}
.rem .top{display:flex;align-items:center;gap:10px}
.rem .tm{font-family:var(--fl-font-mono);font-size:16px;color:var(--fl-text-primary)}
.rem.next .tm{font-size:20px;color:var(--fl-text-highlight)}
.rem .cd{font-family:var(--fl-font-mono);font-size:11.5px;color:var(--fl-text-faint)}
.rem .rt{font-size:14px;color:var(--fl-text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rem.next .rt{font-size:15px;font-weight:500;color:var(--fl-text-highlight)}
.tile.strong{background:var(--fl-strong-bg);color:var(--fl-strong-fg);box-shadow:var(--fl-shadow-strong-tile)}
.tile.b{width:30px;height:30px;border-radius:9px}
.tl{padding:6px 18px 14px}
.hr{position:relative;height:30px;display:flex;align-items:flex-start;gap:12px}
.hr .t{width:40px;font-family:var(--fl-font-mono);font-size:11px;color:var(--fl-text-faint);transform:translateY(-7px)}
.hr .l{flex:1;border-top:1px solid var(--fl-edge-divider)}
.ev{position:absolute;left:52px;right:0;top:-2px;display:flex;align-items:center;gap:8px;height:26px;padding:0 10px;border-radius:8px;font-size:12.5px;background:var(--fl-ground-tile);color:var(--fl-text-primary);z-index:1}
.ev.next{background:var(--fl-ground-float);box-shadow:0 0 0 1px var(--fl-edge-float);color:var(--fl-text-highlight)}
.ev .x{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.now{position:absolute;left:44px;right:0;height:1.5px;background:var(--fl-text-highlight);z-index:2}
.now span{position:absolute;left:-44px;top:-9px;height:18px;padding:0 6px;border-radius:var(--fl-radius-pill);background:var(--fl-strong-bg);color:var(--fl-strong-fg);font-family:var(--fl-font-mono);font-size:10.5px;display:flex;align-items:center}
.urow{display:flex;align-items:center;gap:10px;padding:7px 18px;font-size:13.5px;color:var(--fl-text-body)}
.urow .x{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.primary-button{height:34px;padding:0 16px;border-radius:var(--fl-radius-button);background:var(--fl-strong-bg);box-shadow:var(--fl-shadow-primary-button);color:var(--fl-strong-fg);font-weight:500;font-size:13.5px;white-space:nowrap}
.primary-button:hover{background:var(--fl-text-highlight)}
.secondary-button{height:32px;padding:0 12px;border-radius:var(--fl-radius-button);background:var(--fl-ground-tile);box-shadow:inset 0 0 0 1px var(--fl-edge-chip);color:var(--fl-text-primary);font-size:13px;white-space:nowrap}
.secondary-button:hover{background:var(--fl-ground-float);box-shadow:inset 0 0 0 1px var(--fl-edge-float)}
.quiet-button{height:32px;padding:0 12px;border-radius:var(--fl-radius-button);color:var(--fl-text-secondary);font-size:13px;white-space:nowrap}
.quiet-button:hover{background:var(--fl-ground-tile);color:var(--fl-text-primary)}

/* Note (mockup 13's conflict card) */
.note{padding:28px 32px;display:flex;flex-direction:column;gap:12px;line-height:1.7}
.note h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em;color:var(--fl-text-highlight);line-height:1.2}
.note h2{margin:8px 0 0;font-size:18px;font-weight:600;color:var(--fl-text-primary)}
.note p{margin:0;font-size:var(--fl-size-note);color:var(--fl-text-body)}
.cchip{height:22px;padding:0 9px;border-radius:7px;background:var(--fl-ground-tile);box-shadow:inset 0 0 0 1px var(--fl-edge-chip);color:var(--fl-text-primary);font-size:12px;display:inline-flex;align-items:center;margin-left:8px}
.conflict{border-radius:12px;background:var(--fl-ground-well);box-shadow:inset 0 0 0 1px var(--fl-edge-card);padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.conflict .h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fl-text-secondary)}
.conflict .b{display:flex;gap:8px;margin-top:4px}
.notice{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:16px;background:var(--fl-ground-well);box-shadow:inset 0 0 0 1px var(--fl-edge-card)}
.notice .tx{flex:1;display:flex;flex-direction:column;gap:4px}
.notice .t1{font-size:14px;font-weight:600;color:var(--fl-text-highlight)}
.notice .t2{font-size:13px;line-height:1.55;color:var(--fl-text-secondary)}
.notice .b{display:flex;gap:8px;margin-top:8px}

/* Settings (app.css .settings-*) */
.settings-section{display:flex;flex-direction:column;padding:14px 18px 8px}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:56px;padding:10px 0;border-top:1px solid var(--fl-edge-divider)}
.settings-row.first{border-top:0}
.settings-text{min-width:0;display:flex;flex-direction:column;gap:3px}
.settings-name{font-size:14px;color:var(--fl-text-body)}
.settings-note{font-size:12.5px;line-height:1.5;color:var(--fl-text-muted)}
.settings-lead{display:flex;align-items:center;gap:12px;min-width:0}
.settings-control{flex:0 0 auto;display:flex;align-items:center;gap:6px}
.panel-label{font-size:var(--fl-size-label);letter-spacing:.07em;text-transform:uppercase;color:var(--fl-text-faint)}

/* Menus, popovers, dialogs, toast */
.fl-menu{position:absolute;z-index:30;min-width:236px;padding:5px;border-radius:var(--fl-radius-row);background:var(--fl-ground-float);box-shadow:var(--fl-shadow-float);font-size:13px;animation:menu-in var(--fl-dur-base) ease-out;transform-origin:top left}
@keyframes menu-in{from{opacity:0;transform:scale(.98)}}
.fl-menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:8px;color:var(--fl-text-primary);text-align:left}
.fl-menu-item .grow{flex:1}
.fl-menu-item:hover,.fl-menu-item.active{background:var(--fl-ground-tile)}
.fl-menu-item .hint{color:var(--fl-text-faint)}
.fl-menu-item.muted{color:var(--fl-text-secondary)}
.fl-menu-divider{height:1px;margin:5px 6px;background:var(--fl-edge-float)}
.fl-menu-label{display:flex;justify-content:space-between;align-items:center;padding:7px 10px 5px;font-size:var(--fl-size-label);letter-spacing:.07em;text-transform:uppercase;color:var(--fl-text-faint)}
.fl-menu-label .k{letter-spacing:0;text-transform:none;font-family:var(--fl-font-mono);font-size:10.5px}
.sm-row{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:9px;text-align:left}
.sm-row:hover,.sm-row.active{background:var(--fl-ground-tile)}
.sm-row .stile{width:28px;height:28px;border-radius:8px;font-size:13px}
.sm-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.sm-name{font-size:13.5px;color:var(--fl-text-primary)}
.sm-sub{font-size:11.5px;color:var(--fl-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-state{display:flex;align-items:center;gap:8px;color:var(--fl-text-secondary)}
.sm-state .c{position:relative;display:flex}
.sm-state .c .att-dot{right:-2px;top:0}
.sm-cur{display:flex;color:var(--fl-text-secondary);width:14px}
.pop{position:absolute;z-index:30;width:304px;padding:14px;border-radius:var(--fl-radius-row);background:var(--fl-ground-float);box-shadow:var(--fl-shadow-float);display:flex;flex-direction:column;gap:12px;animation:menu-in var(--fl-dur-base) ease-out;transform-origin:top left}
.pop .hd{display:flex;align-items:center;gap:10px}
.pop .hd .tx{display:flex;flex-direction:column;min-width:0}
.pop .t1{font-size:14px;font-weight:600;color:var(--fl-text-highlight)}
.pop .t2{font-family:var(--fl-font-mono);font-size:11.5px;color:var(--fl-text-faint)}
.pop .st{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fl-text-secondary)}
.pop .sep{height:1px;background:var(--fl-edge-float)}
.pop .person{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--fl-text-primary)}
.pop .person .e{font-family:var(--fl-font-mono);font-size:11px;color:var(--fl-text-faint)}
.pop .legend{display:flex;flex-direction:column;gap:5px}
.pop .legend span{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fl-text-secondary)}
.pop .foot{display:flex;justify-content:space-between;align-items:center}
.dim{position:absolute;inset:0;z-index:40;background:var(--fl-spotlight-dim);animation:dim-in var(--fl-dur-base) ease}
@keyframes dim-in{from{opacity:0}}
.dialog{position:absolute;z-index:41;left:50%;top:132px;width:500px;transform:translateX(-50%);padding:22px;border-radius:var(--fl-radius-card);background:var(--fl-ground-float);box-shadow:var(--fl-shadow-float);display:flex;flex-direction:column;gap:14px;animation:dlg-in var(--fl-dur-base) cubic-bezier(.2,.9,.3,1)}
@keyframes dlg-in{from{opacity:0;transform:translate(-50%,6px) scale(.985)}}
.dialog .hd{display:flex;align-items:center;gap:12px}
.dt{font-size:16px;font-weight:600;line-height:1.35;color:var(--fl-text-highlight)}
.dsub{font-family:var(--fl-font-mono);font-size:11.5px;color:var(--fl-text-faint)}
.dp{margin:0;font-size:13px;line-height:1.55;color:var(--fl-text-secondary)}
.dp b{color:var(--fl-text-primary);font-weight:500}
.dlabel{font-size:12.5px;font-weight:500;color:var(--fl-text-primary)}
.well{display:flex;flex-direction:column;gap:9px;padding:12px 14px;border-radius:11px;background:var(--fl-ground-well);box-shadow:inset 0 0 0 1px var(--fl-edge-divider)}
.fact{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--fl-text-primary)}
.fact .i{display:flex;padding-top:2px;color:var(--fl-text-secondary)}
.actions{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.actions .left{margin-right:auto;font-size:12px;color:var(--fl-text-faint)}
.field{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:38px;padding:6px 10px;border-radius:10px;background:var(--fl-ground-well);box-shadow:inset 0 0 0 1px var(--fl-edge-chip);font-size:13.5px;color:var(--fl-text-primary)}
.field.focus{box-shadow:inset 0 0 0 1px var(--fl-accent)}
.field .ph{color:var(--fl-text-faint)}
.field .caret{width:1.5px;height:16px;background:var(--fl-accent);margin-left:-3px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.echip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 6px 0 8px;border-radius:var(--fl-radius-check);background:var(--fl-ground-tile);box-shadow:inset 0 0 0 1px var(--fl-edge-chip);font-family:var(--fl-font-mono);font-size:11.5px;color:var(--fl-text-primary)}
.echip .x{display:flex;color:var(--fl-text-faint)}
.opts{display:flex;gap:10px}
.opt{flex:1;border-radius:14px;padding:14px;background:var(--fl-ground-card);box-shadow:inset 0 0 0 1px var(--fl-edge-float);display:flex;flex-direction:column;gap:8px}
.opt.on{background:var(--fl-ground-hover);box-shadow:inset 0 0 0 1.5px var(--fl-accent)}
.opt .o1{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:var(--fl-text-primary)}
.opt .o2{font-size:12.5px;line-height:1.5;color:var(--fl-text-muted)}
.radio{width:16px;height:16px;flex:0 0 auto;border-radius:50%;border:1.5px solid var(--fl-checkbox-border);display:flex;align-items:center;justify-content:center}
.radio.on{border-color:var(--fl-strong-bg)}
.radio.on::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--fl-strong-bg)}
.mrow{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:13px;color:var(--fl-text-primary)}
.mrow .e{font-family:var(--fl-font-mono);font-size:11px;color:var(--fl-text-faint)}
.mrow .r{margin-left:auto;font-size:12px;color:var(--fl-text-muted)}
.toast{position:absolute;left:50%;bottom:28px;z-index:60;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px 8px 8px 8px;border-radius:16px;background:var(--fl-ground-float);box-shadow:var(--fl-shadow-float);color:var(--fl-text-primary);white-space:nowrap;font-size:13.5px;animation:rise var(--fl-dur-base) var(--fl-ease-spring)}
.toast .tile{width:28px;height:28px}
.toast .faint{color:var(--fl-text-muted)}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px)}}

/* The capture popup (mockup 02) over the window */
.cap{position:absolute;z-index:45;left:50%;top:96px;width:680px;transform:translateX(-50%);border-radius:var(--fl-radius-popup);background:var(--fl-ground-float);box-shadow:var(--fl-shadow-float);padding:14px 18px 12px;display:flex;flex-direction:column;gap:12px;animation:dlg-in var(--fl-dur-fast) ease-out}
.cap .grip{align-self:center;width:32px;height:4px;border-radius:var(--fl-radius-pill);background:var(--fl-edge-chip);margin-top:-4px}
.cap .in{font-size:var(--fl-size-capture);color:var(--fl-text-primary);display:flex;align-items:center;gap:0}
.cap .in .tok{color:var(--fl-text-highlight);background:var(--fl-selection);border-radius:4px;padding:0 2px}
.cap .chips{display:flex;gap:6px}
.cap .bar{display:flex;align-items:center;gap:6px;color:var(--fl-text-muted)}
.cap .bar .tb{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.cap .bar .hint{margin-left:12px;font-size:11.5px;color:var(--fl-text-faint)}
.cap .bar .to{margin-left:auto;font-family:var(--fl-font-mono);font-size:11.5px;color:var(--fl-text-secondary);display:flex;align-items:center;gap:6px}
.cap .bar .send{width:34px;height:34px;background:var(--fl-strong-bg);color:var(--fl-strong-fg);box-shadow:var(--fl-shadow-primary-button)}
.ac{position:absolute;z-index:46;width:360px;padding:5px;border-radius:var(--fl-radius-row);background:var(--fl-ground-float);box-shadow:var(--fl-shadow-float);animation:menu-in var(--fl-dur-base) ease-out}
.ac-row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;font-size:13.5px;color:var(--fl-text-primary)}
.ac-row.active{background:var(--fl-ground-tile)}
.ac-row .grow{flex:1}
.ac-row .sp{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fl-text-muted)}
.ac-row.new{color:var(--fl-text-secondary)}
.ac-row b{font-weight:600;color:var(--fl-text-highlight)}

/* Mini mode (mockup 05, D-110) */
.mini{position:absolute;z-index:45;width:364px;border-radius:var(--fl-radius-popup);background:var(--fl-ground-card);box-shadow:var(--fl-shadow-desktop);padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;animation:dlg-in2 var(--fl-dur-base) ease-out}
@keyframes dlg-in2{from{opacity:0;transform:translateY(6px)}}
.mini .grip{align-self:center;width:32px;height:4px;border-radius:var(--fl-radius-pill);background:var(--fl-edge-chip)}
.mini .mh{display:flex;align-items:center;gap:6px}
.seg{display:flex;padding:3px;border-radius:11px;background:var(--fl-ground-window);box-shadow:inset 0 0 0 1px var(--fl-edge-card)}
.seg span{height:26px;padding:0 10px;border-radius:8px;display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--fl-text-muted);white-space:nowrap}
.seg span.on{background:var(--fl-ground-hover);color:var(--fl-text-highlight);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--fl-text-highlight) 6%,transparent)}
.mini .mt{margin-left:auto;display:flex;gap:2px;color:var(--fl-text-faint)}
.mini .mt span{width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.mrowc{position:relative;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:10px;font-size:13px;color:var(--fl-text-body)}
.mrowc .check{width:17px;height:17px;border-radius:6px}
.mrowc .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrowc .stripe{top:9px;bottom:9px}
.mrem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--fl-ground-float);box-shadow:var(--fl-shadow-card-hover)}
.mrem .tile{width:28px;height:28px}
.mcomp{display:flex;align-items:center;gap:8px;height:38px;padding:0 4px 0 12px;border-radius:12px;background:var(--fl-ground-well);box-shadow:inset 0 0 0 1px var(--fl-edge-card);font-size:13px;color:var(--fl-text-faint)}
.mcomp .send{width:30px;height:30px;margin-left:auto}
.picker{position:absolute;z-index:47;width:300px;padding:6px;border-radius:var(--fl-radius-row);background:var(--fl-ground-float);box-shadow:var(--fl-shadow-float);display:flex;flex-direction:column;gap:1px;animation:menu-in var(--fl-dur-base) ease-out}
.picker .search{height:32px;margin:0 0 4px;padding:0 10px;border-radius:9px;background:var(--fl-ground-well);box-shadow:inset 0 0 0 1px var(--fl-edge-chip);display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fl-text-faint)}
.picker .pl{padding:8px 10px 3px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--fl-text-faint);display:flex;align-items:center;gap:6px}
.picker .pr{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;font-size:13px;color:var(--fl-text-primary)}
.picker .pr.cur{color:var(--fl-text-muted)}
.picker .pr .grow{flex:1}
.picker .pr .tile{width:22px;height:22px;border-radius:7px}

/* ── Concept 2: the space rail ──────────────────────────────────────────── */
.rail{flex:0 0 64px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 0 14px;background:var(--fl-ground-window);border-right:1px solid var(--fl-edge-divider)}
.rtile{position:relative;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--fl-ground-tile);box-shadow:inset 0 0 0 1px var(--fl-edge-chip);color:var(--fl-text-secondary);font-size:15px;font-weight:600}
.rtile.on{background:var(--fl-ground-float);box-shadow:var(--fl-shadow-selected);color:var(--fl-text-highlight)}
.rtile.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--fl-text-highlight)}
.rtile .att-dot{right:-2px;top:-2px;width:8px;height:8px;box-shadow:0 0 0 2px var(--fl-ground-window)}
.rdiv{width:24px;height:1px;background:var(--fl-edge-chip);margin:2px 0}
.rtile.add{margin-top:auto;background:transparent;box-shadow:inset 0 0 0 1px var(--fl-edge-card);color:var(--fl-text-muted)}
.shead{display:flex;align-items:center;gap:8px;padding:0 2px 0 6px;min-height:34px}
.shead .space-name{flex:1}

/* Concept 3: the drag into a shared group card */
.nav-group.ring{box-shadow:0 0 0 1.5px var(--fl-text-highlight)}
.ghost{position:absolute;z-index:20;width:200px;display:flex;align-items:center;gap:10px;padding:7px 10px 7px 7px;border-radius:var(--fl-radius-row);background:var(--fl-ground-float);box-shadow:var(--fl-shadow-float);font-size:14px;color:var(--fl-text-highlight)}
.droptip{position:absolute;z-index:21;padding:8px 10px;border-radius:10px;background:var(--fl-ground-float);box-shadow:var(--fl-shadow-float);font-size:12px;line-height:1.45;color:var(--fl-text-secondary);width:228px}
.droptip b{color:var(--fl-text-highlight);font-weight:500}

/* Concept 4: one long sidebar */
.sbody-scroll{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:3px}
.sect-head{display:flex;align-items:center;gap:8px;min-height:34px;margin-top:10px;padding:0 2px 0 4px}
.sect-head .space-name{flex:1}

/* ── The phone (mockup 14, 09 §12) ──────────────────────────────────────── */
.phones{flex:1;display:flex;justify-content:center;align-items:center;gap:44px;background:color-mix(in srgb,var(--fl-ground-window),black 30%)}
.phonewrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.phonewrap .cap2{font-size:12.5px;color:var(--fl-text-muted)}
.phn{position:relative;width:412px;height:915px;overflow:hidden;border-radius:34px;background:var(--fl-ground-window);box-shadow:0 0 0 1px var(--fl-edge-float),0 0 0 7px color-mix(in srgb,var(--fl-ground-window),black 40%),0 0 0 8px var(--fl-edge-card)}
.phn .status{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-family:var(--fl-font-mono);font-size:12px;color:var(--fl-text-secondary)}
.phn .hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 8px 4px 16px}
.phn .h1{display:flex;align-items:center;gap:10px;font-size:28px;font-weight:700;letter-spacing:-.025em;color:var(--fl-text-highlight)}
.phn .hb{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--fl-text-secondary)}
.phn .who{display:flex;align-items:center;gap:8px;padding:0 20px 14px;font-size:13px;color:var(--fl-text-muted)}
.phn .who .disc{width:22px;height:22px;font-size:10.5px;box-shadow:0 0 0 1.5px var(--fl-ground-window),inset 0 0 0 1px var(--fl-edge-chip)}
.phn .psearch{margin:0 16px 14px;height:48px;border-radius:14px;background:var(--fl-ground-card);box-shadow:0 0 0 1px var(--fl-edge-card);display:flex;align-items:center;gap:12px;padding:0 16px;color:var(--fl-text-muted);font-size:15.5px}
.phn .pitem{display:flex;align-items:center;gap:14px;height:56px;padding:0 16px;margin:0 12px;border-radius:12px;font-size:16px;color:var(--fl-text-body)}
.phn .pitem .tile{width:32px;height:32px;border-radius:9px}
.phn .pitem .grow{flex:1}
.phn .pitem .nav-count{font-size:13px}
.phn .pgroup{margin:4px 12px 10px;padding:4px;border-radius:18px;background:var(--fl-ground-card);box-shadow:0 0 0 1px var(--fl-edge-divider)}
.phn .pgroup .pitem{margin:0}
.phn .plabel{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--fl-text-muted)}
.phn .navbar{position:absolute;left:0;right:0;bottom:0;height:80px;background:var(--fl-ground-sidebar);border-top:1px solid var(--fl-edge-divider);display:flex;justify-content:space-around;align-items:center;padding:0 8px 6px}
.phn .tab{display:flex;flex-direction:column;align-items:center;gap:4px;width:96px;font-size:12.5px;color:var(--fl-text-secondary)}
.phn .pill{width:60px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.phn .tab.on{color:var(--fl-text-highlight);font-weight:500}
.phn .tab.on .pill{background:var(--fl-strong-bg);color:var(--fl-strong-fg)}
.phn .fab{position:absolute;right:18px;bottom:98px;width:60px;height:60px;border-radius:18px;background:var(--fl-strong-bg);color:var(--fl-strong-fg);box-shadow:var(--fl-shadow-primary-button);display:flex;align-items:center;justify-content:center}
.phn .scrim{position:absolute;inset:0;background:var(--fl-spotlight-dim)}
.phn .sheet{position:absolute;left:0;right:0;bottom:0;border-radius:22px 22px 0 0;background:var(--fl-ground-float);box-shadow:var(--fl-shadow-float);padding:10px 12px 30px;display:flex;flex-direction:column;gap:2px}
.phn .handle{align-self:center;width:36px;height:4px;border-radius:var(--fl-radius-pill);background:var(--fl-edge-chip);margin-bottom:12px}
.phn .st{padding:0 12px 10px;font-size:20px;font-weight:600;color:var(--fl-text-highlight)}
.phn .srow{display:flex;align-items:center;gap:14px;min-height:64px;padding:8px 12px;border-radius:14px}
.phn .srow.on{background:var(--fl-ground-tile)}
.phn .srow .stile{width:38px;height:38px;border-radius:11px;font-size:16px}
.phn .srow .tx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.phn .srow .n{font-size:16px;color:var(--fl-text-primary)}
.phn .srow .s{font-size:13px;color:var(--fl-text-muted)}
.phn .sdiv{height:1px;margin:8px 12px;background:var(--fl-edge-float)}
.phn .act{display:flex;align-items:center;gap:14px;height:52px;padding:0 12px;font-size:15.5px;color:var(--fl-text-secondary)}
.phn .act .tile{width:38px;height:38px;border-radius:11px}

  line: '<h2>1 · The space line <span style="font-weight:400;color:var(--fl-text-muted)">(chosen by Davit, D-189: build these components exactly)</span></h2>' +
    '<div><h3>Idea</h3><p>Everything that is <b>yours</b> (Today, Inbox, Focus, quick notes, reminders, pins, search) sits above a hairline and never changes. Below it, the “Lists” label becomes the <b>space switcher</b>: the space’s lists, notes and groups. Switching changes only what is under the line; opening a list from another space (Today’s chip, Ctrl+K, Back) moves the line with it, so the sidebar always shows the open list’s space. A shared space says who is in it once, under its name; rows carry no marks.</p>' +
    '<h3>Why it fits</h3><ul><li>Capture keeps zero decisions: no ## always means your Inbox (principles 1, 2).</li><li>One sidebar, one Today; groups stay what they are, one level inside each space (D-73).</li><li>Marks scale with stakes: shared with people is said loudly and once (space, list header, chips); your devices vs this PC stays as quiet as D-163 made it.</li><li>Someone with one space sees no change: the label reads “Lists” until a second space exists.</li></ul>' +
    '<h3>Costs</h3><ul><li>Lists of the other spaces are one switch away (Ctrl+K still finds everything).</li><li>The row under the line is busier than the old label: the tile, the name, the cloud, sort and +.</li><li>A new rule to learn: what is above the line never switches.</li></ul></div>' +
    '<div><h3>Today, capture, mini, phone</h3><ul><li><b>Today</b> and the Timeline cover every space; a shared list’s chip carries its space’s letter. No per-space Today.</li><li><b>Joining</b> is one click on the link in the invite e-mail (flintnotes.app/join, the space’s ID after the #), then Open Flint (once) and one confirmation: Flint’s Join for OneDrive, Google’s Select for Google. “Join with an invite link” stays as the fallback in Ctrl+K and Settings.</li><li><b>The letter</b> is the same everywhere (chips, ## menu, mini’s picker): on the right, the full name on hover; in the main window a click switches the sidebar to that space, with the switch motion and a pop on the switcher’s tile.</li><li><b>Capture</b> goes to your Inbox; ## reaches any space and the chip names it; a new list from capture is made in Personal.</li><li><b>Mini</b>: Today across spaces, Inbox is yours, the list picker grouped by space.</li><li><b>Phone</b>: the Lists tab’s title is the switcher (a sheet); Today and Inbox stay.</li><li><b>Search, Focus, reminders, Trash</b> cover every space; each result or row names a shared space.</li></ul>' +
    '<h3>Motion (03 §5, D-75, D-89)</h3><ul><li><b>Switching:</b> under the line the rows slide 12 px out and the new space’s slide 12 px in from the other side, toward the space’s place in the menu (<code>--fl-dur-page</code>, the page curve); the tile and name crossfade; nothing above the line moves. A second switch retargets mid-way.</li><li><b>The menu</b> opens as menus do; the people line folds in and out.</li><li><b>A new space</b> eases into the menu, then the sidebar switches to it and its tile pops once (<code>--fl-ease-press</code>).</li><li><b>Moving into a shared space:</b> the row lifts and travels to the space’s tile (spring), the tile pops, the rows close up (FLIP); the line follows if the list was open, and the row flashes there. Undo flies it back.</li><li>All instant under reduce-motion; none of it waits for input.</li></ul></div>' +
    '<div class="full"><h3>The open question (A, B or C)</h3><p><b>A, with three additions.</b> (1) The sidebar follows the open list’s space. (2) Capture never picks or makes a shared target by itself: no ## means Inbox, a new list from ## is personal, and a shared target always shows its space before Enter. (3) Everything that is about <i>you</i> spans every space: Today, reminders, Focus, search, mini, Trash. <b>Not B:</b> the popup is used on calls without looking at the main window, so “the current space’s Inbox” would put a private thought in a colleague’s Inbox; and a split Today hides pins and reminders (principle 8). <b>Not C:</b> Today is one place for the day; a per-space Today is a mode in which tasks hide. If people ask, a filter in Today’s ⋯ can come later.</p></div>',
  rail: '<h2>2 · Space rail</h2><div><h3>Idea</h3><p>A narrow rail of space tiles at the window’s left edge (shown from the second space), the sidebar showing the chosen space under Today, Inbox and Focus.</p><h3>Why it fits</h3><ul><li>The fastest switching by mouse, and a dot per space for its state.</li><li>Scales to many spaces.</li></ul></div><div><h3>Costs</h3><ul><li>64 px of permanent chrome and a second column of tiles beside the sidebar’s.</li><li>Looks like Slack or Discord, where everything switches (option B), so Today and Inbox staying put surprises.</li><li>Mini and the phone can’t have a rail, so each device works differently.</li></ul><h3>Today, capture, mini, phone</h3><p>As in 1. The phone would need the sheet anyway.</p></div>',
  groups: '<h2>3 · Spaces are groups (Davit’s first idea)</h2><div><h3>Idea</h3><p>No switching: a shared space is a group card, its people in its header; personal groups show their level there too (the cloud for your devices). One organizing concept instead of two.</p><h3>Why it fits</h3><ul><li>One thing to learn; levels shown once per card, no row marks.</li><li>No mode, nothing hidden.</li></ul></div><div><h3>Costs</h3><ul><li><b>A drag between two cards shares or unshares a list:</b> the accidental share the brief wants to rule out is one slip away.</li><li>Groups become heavy (a folder on disk, a sync target, people, an account); D-73 made them deliberately light.</li><li>Personal groups and their per-item sync (D-161, D-163) would have to change.</li><li>The sidebar is no shorter, which was the reason for the idea.</li></ul></div>',
  long: '<h2>4 · One long sidebar</h2><div><h3>Idea</h3><p>Each space is a titled section of one sidebar (Personal first), its groups inside; collapse a space to hide it.</p><h3>Why it fits</h3><ul><li>No mode; continues D-161’s “one sidebar with everything on this PC”.</li></ul></div><div><h3>Costs</h3><ul><li>The clutter Davit wants to avoid grows with every space; the sidebar scrolls.</li><li>Two kinds of collapsible header (space, group) to tell apart.</li><li>A + per space.</li></ul></div>'
};

/* ---------- Rendering ---------- */
var S = {concept:'line', state:'personal', space:'p', open:'backend', joined:['p','h','u'], opts:{}};
function render(){
  var st = STATES[S.concept].filter(function(x){ return x.id === S.state; })[0];
  $('ctabs').innerHTML = CONCEPTS.map(function(c){ return '<button data-c="' + c.id + '" class="' + (c.id === S.concept ? 'on' : '') + '">' + c.label + (c.pick ? '<span class="pick">CHOSEN</span>' : '') + '</button>'; }).join('');
  $('stabs').innerHTML = STATES[S.concept].map(function(x){ return '<button data-s="' + x.id + '" class="' + (x.id === S.state ? 'on' : '') + '">' + x.label + '</button>'; }).join('');
  $('caption').innerHTML = st.cap;
  $('notes').innerHTML = NOTES[S.concept];
  var sim = $('sim'); sim.hidden = !st.sim; sim.textContent = st.sim || '';
  var win = $('win');
  if (st.phone) { win.innerHTML = phones(); return; }
  if (st.email) { win.innerHTML = emailAndPage(); return; }
  var side;
  if (st.railSide) side = sideRail();
  else if (st.groupSide) side = sideGroups();
  else if (st.longSide) side = sideLong();
  else {
    var o = st.side; S.space = o.space; S.open = o.open; S.joined = o.joined || ['p','h','u']; S.opts = o;
    side = '<aside class="sidebar" id="sidebar">' + sideC1(o) + '</aside>';
  }
  win.innerHTML = caps() + side + '<main class="main"><div class="titlebar"></div><div class="scroller"><div class="pair"><div class="content" id="content">' + PAGES[st.page]() + '</div>' + (st.col ? '<div class="tcol">' + todayCol() + '</div>' : '') + '</div></div></main>' + overlay(st.over) + (st.groupSide ? dragGhost() : '');
  place(st);
}
function overlay(kind){
  if (!kind) return '';
  return {googleWaiting:googleWaiting, joinedToast:joinedToast, spaceMenu:spaceMenu, moveMenu:moveMenu, shareDialog:shareDialog, movedToast:movedToast, newDialog:newDialog, inviteDialog:inviteDialog, joinDialog:joinDialog, joinConfirm:joinConfirm, infoPop:infoPop, capture:capturePopup, mini:miniCards}[kind]();
}
function dragGhost(){ return '<div class="ghost" id="ghost"><span class="tile">' + ic('list') + '</span>Trip ideas</div><div class="droptip" id="droptip">Dropped here, <b>Trip ideas</b> is shared with Sam. In this concept that is the only warning.</div>'; }
function rel(el){ var r = el.getBoundingClientRect(), w = $('win').getBoundingClientRect(); return {x:r.left - w.left, y:r.top - w.top, w:r.width, h:r.height}; }
function place(st){
  var m;
  if ((m = $('space-menu'))) { var b = rel($('space-btn')); m.style.left = (b.x - 2) + 'px'; m.style.top = (b.y + b.h + 6) + 'px'; }
  if ((m = $('ctx-menu'))) { var n = rel($('nav-trip')); m.style.left = (n.x + 150) + 'px'; m.style.top = (n.y + 18) + 'px';
    var mv = rel($('ctx-move')), sub = $('ctx-sub'); sub.style.left = (mv.x + mv.w + 9) + 'px'; sub.style.top = (mv.y - 5) + 'px'; }
  if ((m = $('info-pop'))) { var p = rel($('people')); m.style.left = (p.x) + 'px'; m.style.top = (p.y + p.h + 6) + 'px'; }
  if ((m = $('ac'))) { var t = rel($('tok')), cp = rel($('cap')); m.style.left = (t.x - 4) + 'px'; m.style.top = (cp.y + cp.h + 8) + 'px'; }
  if ((m = $('ghost'))) { var g = rel($('g-home')), gp = rel($('drop-gap')); m.style.left = (g.x + 14) + 'px'; m.style.top = (gp.y + 1) + 'px';
    var tip = $('droptip'); tip.style.left = (g.x + g.w + 14) + 'px'; tip.style.top = (g.y + 4) + 'px'; }
  if (st.side && st.side.menu) { var btn = $('space-btn'); if (btn) btn.classList.add('open'); }
  if (st.side && st.side.newSpace && !reduced()) { // a space just joined: its tile pops, its lists slide in
    $('space-btn').querySelector('.stile').classList.add('tpop');
    var body = $('space-stage').querySelector('.space-body'); body.style.setProperty('--dx', '12px'); body.classList.add('in');
  }
}

/* ---------- Live: switching spaces (concept 1) ---------- */
function liveState(){ var st = STATES[S.concept].filter(function(x){ return x.id === S.state; })[0]; return S.concept === 'line' && st && st.live; }
function openMenu(){
  if (!liveState() || $('space-menu')) return;
  $('win').insertAdjacentHTML('beforeend', spaceMenu());
  $('space-btn').classList.add('open'); place({});
}
function closeMenu(){
  var m = $('space-menu'); if (!m) return;
  var b = $('space-btn'); if (b) b.classList.remove('open');
  if (reduced()) { m.remove(); return; }
  m.style.transition = 'opacity 120ms ease'; m.style.opacity = '0'; setTimeout(function(){ m.remove(); }, 120);
}
function switchTo(id, keepMenu){
  if (!keepMenu) closeMenu();
  if (id === S.space) return;
  var dir = ORDER.indexOf(id) > ORDER.indexOf(S.space) ? 1 : -1;
  var wasList = ['today','inbox','focus','settings'].indexOf(S.open) < 0;
  S.space = id;
  if (wasList) S.open = LAST[id];
  var o = {space:id, open:S.open};
  var hd = $('space-head'); hd.innerHTML = spaceHead(SP[id], o); hd.classList.remove('morph'); void hd.offsetWidth; hd.classList.add('morph');
  var ps = $('people-slot'); ps.innerHTML = peopleLine(SP[id], o); ps.classList.remove('in'); void ps.offsetWidth; if (SP[id].with.length) ps.classList.add('in');
  var stage = $('space-stage'), old = stage.querySelector('.space-body:not(.out)');
  var neu = document.createElement('div'); neu.className = 'space-body'; neu.innerHTML = items(id, S.open, o);
  stage.querySelectorAll('.space-body.out').forEach(function(x){ x.remove(); });
  if (reduced()) { old.replaceWith(neu); }
  else {
    old.style.setProperty('--dx', (-12 * dir) + 'px'); old.classList.add('out');
    neu.style.setProperty('--dx', (12 * dir) + 'px'); neu.classList.add('in');
    stage.appendChild(neu); setTimeout(function(){ old.remove(); }, 200);
  }
  if (wasList) {
    var pageKey = {backend:'backend', groceries:'groceries', design:'design'}[S.open];
    var c = $('content'); c.innerHTML = PAGES[pageKey](); c.classList.remove('in'); void c.offsetWidth; c.classList.add('in');
  }
}

/* ---------- Live: the move into Home, replayed ---------- */
function replayMove(){
  var win = $('win');
  S.state = 'moved';
  // Back to the moment before: Personal, Trip ideas open.
  var o = {space:'p', open:'trip'};
  $('sidebar').innerHTML = sideC1(o); S.space = 'p';
  var c = $('content'); c.innerHTML = PAGES.tripP();
  var t = $('toast'); if (t) t.remove();
  var fromEl = $('nav-trip'), from = rel(fromEl), to = rel($('space-btn').querySelector('.stile'));
  if (reduced()) { finishMove(); return; }
  var fly = document.createElement('div'); fly.className = 'flyer'; fly.innerHTML = '<span class="tile">' + ic('list') + '</span>Trip ideas';
  fly.style.left = from.x + 'px'; fly.style.top = from.y + 'px'; fly.style.width = from.w + 'px'; win.appendChild(fly);
  fromEl.style.visibility = 'hidden';
  // The rows below close up (FLIP-like height fold).
  fromEl.animate([{height: from.h + 'px', marginTop:'0px'}, {height:'0px', marginTop:'-3px', paddingTop:'0px', paddingBottom:'0px'}], {duration:260, delay:120, easing:'cubic-bezier(.2,.9,.3,1)', fill:'forwards'});
  fly.animate([
    {transform:'translate(0,0) scale(1)', opacity:1},
    {transform:'translate(0,-6px) scale(1.02)', opacity:1, offset:.15},
    {transform:'translate(' + (to.x - from.x - 6) + 'px,' + (to.y - from.y - 6) + 'px) scale(.4)', opacity:.0}
  ], {duration:440, easing:'cubic-bezier(.2,.9,.3,1.05)', fill:'forwards'}).onfinish = function(){
    fly.remove();
    var tile = $('space-btn').querySelector('.stile'); tile.classList.add('tpop');
    setTimeout(finishMove, 160);
  };
}
function finishMove(){
  S.space = 'h';
  var o = {space:'h', open:'trip', moved:true, flash:true, syncing:true};
  var hd = $('space-head'); hd.innerHTML = spaceHead(SP.h, o); hd.classList.remove('morph'); void hd.offsetWidth; hd.classList.add('morph');
  var ps = $('people-slot'); ps.innerHTML = peopleLine(SP.h, o); ps.classList.remove('in'); void ps.offsetWidth; ps.classList.add('in');
  var stage = $('space-stage'), old = stage.querySelector('.space-body');
  var neu = document.createElement('div'); neu.className = 'space-body'; neu.innerHTML = items('h', 'trip', o);
  if (reduced()) old.replaceWith(neu); else { old.style.setProperty('--dx', '-12px'); old.classList.add('out'); neu.style.setProperty('--dx', '12px'); neu.classList.add('in'); stage.appendChild(neu); setTimeout(function(){ old.remove(); }, 200); }
  var c = $('content'); c.innerHTML = PAGES.tripH(); c.classList.remove('in'); void c.offsetWidth; c.classList.add('in');
  $('win').insertAdjacentHTML('beforeend', movedToast());
}

/* ---------- Events ---------- */
document.addEventListener('click', function(e){
  var c = e.target.closest('[data-c]'); if (c) { S.concept = c.dataset.c; S.state = STATES[S.concept][0].id; render(); return; }
  var s = e.target.closest('[data-s]'); if (s) { S.state = s.dataset.s; render(); return; }
  if (e.target.closest('#sim')) { replayMove(); return; }
  var row = e.target.closest('[data-space]'); if (row && $('space-menu')) { switchTo(row.dataset.space); return; }
  var letter = e.target.closest('.mm[data-sp]');
  if (letter && letter.closest('.main') && S.concept === 'line' && $('space-stage')) {
    hideTip();
    if (!reduced()) { letter.classList.remove('press'); void letter.offsetWidth; letter.classList.add('press'); }
    switchTo(letter.dataset.sp);
    var t = $('space-btn').querySelector('.stile'); t.classList.remove('tpop'); void t.offsetWidth; if (!reduced()) t.classList.add('tpop');
    return;
  }
  if (e.target.closest('#space-btn')) { if ($('space-menu')) closeMenu(); else openMenu(); return; }
  if ($('space-menu') && !e.target.closest('#space-menu') && liveState()) closeMenu();
});
document.addEventListener('keydown', function(e){
  if (e.ctrlKey && e.shiftKey && (e.key === 'S' || e.key === 's')) { e.preventDefault(); if ($('space-menu')) closeMenu(); else openMenu(); return; }
  if ($('space-menu') && liveState()) {
    if (e.key === 'Escape') { closeMenu(); return; }
    var i = parseInt(e.key, 10); if (i >= 1 && i <= S.joined.length) { switchTo(S.joined[i - 1]); }
  }
});
/* The letter's tooltip: the space's full name; in the main window also what a click does. */
var tipTimer = null;
function hideTip(){ clearTimeout(tipTimer); var t = $('tip'); if (t) t.remove(); }
document.addEventListener('mouseover', function(e){
  var l = e.target.closest('.mm[data-sp]'); if (!l || l.contains(e.relatedTarget)) return;
  hideTip();
  tipTimer = setTimeout(function(){
    var r = rel(l), click = l.closest('.main') && S.concept === 'line' && $('space-stage');
    var tip = document.createElement('div'); tip.className = 'tip'; tip.id = 'tip';
    tip.innerHTML = '<span>' + spName(l.dataset.sp) + '</span>' + (click ? '<span class="k">Click to switch to ' + SP[l.dataset.sp].name + '</span>' : '');
    $('win').appendChild(tip);
    tip.style.left = Math.max(8, r.x + r.w / 2 - tip.offsetWidth / 2) + 'px'; tip.style.top = (r.y - tip.offsetHeight - 8) + 'px';
  }, 250);
});
document.addEventListener('mouseout', function(e){ var l = e.target.closest('.mm[data-sp]'); if (l && !l.contains(e.relatedTarget)) hideTip(); });
/* For scripts/render-mockups.mjs: setMode('personal') (a state's id, unique across concepts) or setMode('line:personal'). */
function setMode(id){
  var parts = id.split(':');
  if (parts.length === 1) { for (var c in STATES) { if (STATES[c].some(function(x){ return x.id === id; })) { S.concept = c; S.state = id; render(); return; } } if (!STATES[id]) throw new Error('unknown state ' + id); }
  S.concept = parts[0]; S.state = parts[1] || STATES[S.concept][0].id; render();
}
render();
</script>
</body>
</html>
