<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'"
    />
    <title>Flint hotkeys</title>
    <link rel="stylesheet" href="./hotkeys.css" />
  </head>
  <body>
    <main class="panel">
      <h1>Hotkeys</h1>
      <p class="lead">They work from any app. Click one, then press the new keys.</p>
      <div class="row" data-name="capture">
        <div class="label">
          <span class="name">Quick capture</span>
          <span class="sub">Opens the capture popup</span>
        </div>
        <button type="button" class="record" aria-label="Change the quick capture hotkey"></button>
      </div>
      <div class="row" data-name="selection">
        <div class="label">
          <span class="name">Capture selection</span>
          <span class="sub">Copies what is selected, then opens the popup</span>
        </div>
        <button
          type="button"
          class="record"
          aria-label="Change the capture selection hotkey"
        ></button>
      </div>
      <p class="message" role="status"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
