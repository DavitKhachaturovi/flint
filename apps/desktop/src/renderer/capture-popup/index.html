<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'"
    />
    <title>Flint capture</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="card" aria-label="Capture a task">
      <div class="card-grip" title="Drag to move" aria-hidden="true"></div>
      <button type="button" class="card-close" aria-label="Close (the draft is kept)">
        <svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true">
          <path
            d="M3 3l6 6M9 3l-6 6"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          ></path>
        </svg>
      </button>
      <div class="notice" role="status" hidden>
        <span class="notice-text"></span>
        <button type="button" class="notice-action"></button>
        <button type="button" class="notice-close" aria-label="Dismiss">×</button>
      </div>
      <div class="previous" hidden>
        <span class="previous-text">Previous draft</span>
        <button type="button" class="previous-restore">Restore</button>
        <button type="button" class="previous-close" aria-label="Forget the previous draft">
          ×
        </button>
      </div>
      <div class="chips" aria-live="polite"></div>
      <label class="visually-hidden" for="capture">Task title</label>
      <input
        id="capture"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="Capture a task…"
        aria-controls="suggestions"
      />
      <ul id="suggestions" class="suggestions" role="listbox" aria-label="Lists" hidden></ul>
      <div class="choice" aria-live="polite" hidden></div>
      <div class="blocks" aria-label="Selection" hidden></div>
      <div class="tools">
        <div class="tool-group">
          <button
            type="button"
            class="tool"
            data-insert="attach"
            aria-label="Attach"
            title="Paste a screenshot with Ctrl+V"
            disabled
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M12 5v14M5 12h14"></path>
            </svg>
          </button>
          <button type="button" class="tool" data-picker="priority" aria-label="Set priority">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 21V4M5 4h11l-2 4 2 4H5"></path>
            </svg>
          </button>
          <button type="button" class="tool" data-picker="list" aria-label="Choose list">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"></path>
            </svg>
          </button>
          <button type="button" class="tool" data-picker="time" aria-label="Set reminder">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
              <path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path>
            </svg>
          </button>
        </div>
        <span class="hint">Enter saves · Esc keeps draft · Shift+Esc discards</span>
        <div class="tool-group">
          <span class="target"
            ><img class="target-icon" alt="" /><span class="target-name">Inbox</span></span
          >
          <button type="button" class="send" aria-label="Save task">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 19V5M5 12l7-7 7 7"></path>
            </svg>
          </button>
        </div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
