# Installer (docs/05 §6, D-19): unsigned, per-user NSIS, no admin rights.
# Never change it once installed: upgrades, the start-with-Windows entry and Windows' notification
# settings are keyed by it (D-33). Must match IDENTITIES.installed in src/main/identity.ts.
appId: com.davitkhachaturovi.flint
productName: Flint
# The packaged app is "flint" (install folder %LOCALAPPDATA%\Programs\flint), not the workspace name.
extraMetadata:
  name: flint
copyright: Copyright © 2026 Davit Khachaturovi
directories:
  output: dist-installer
  buildResources: resources
# The Electron that was installed and checked (D-30), not a second download.
electronDist: ../../node_modules/electron/dist
# Hardening (D-34): the packaged Flint.exe can't be used as a general Node runtime or debugged from
# outside, runs only its own verified app.asar, and gives file:// no extra privileges (the UI is
# served from app://flint instead). Checked by scripts/check-fuses.mjs after packaging.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
files:
  - out/**
  - package.json
# koffi loads a native binary, which Windows can't read from inside the asar archive.
asarUnpack:
  - '**/node_modules/koffi/**'
extraResources:
  - from: resources
    to: .
    filter:
      - tray-*.png
      - icon.ico
  # The OFL asks for its licence to travel with the fonts (docs/09 §7).
  - from: src/renderer/fonts
    to: licenses/fonts
    filter:
      - OFL-*.txt
# flint:// is registered by the app at runtime (NSIS ignores `protocols`) and removed by installer.nsh.
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  # APP-06, D-136: the installer is unsigned for now (D-19, D-135), so there is no publisher name to
  # check updates against; said explicitly (electron-builder 28 refuses a missing name otherwise).
  # Integrity: HTTPS from GitHub and the SHA-512 in latest.yml. Signed update manifests (Ed25519,
  # electron-updater 7) and code signing are the follow-ups.
  verifyUpdateCodeSignature: false
# APP-06, D-136: GitHub Releases is the update feed (public repository, no token in the app).
# The release workflow uploads to a draft release for the tag and publishes it with its text.
publish:
  provider: github
  owner: DavitKhachaturovi
  repo: flint
  releaseType: draft
nsis:
  # APP-16, D-68: one click, per user, no wizard pages; Flint starts when it is done (also when an
  # update is installed over a running Flint).
  oneClick: true
  # A name without spaces: the same on GitHub Releases as in latest.yml.
  artifactName: Flint-Setup-${version}.${ext}
  runAfterFinish: true
  perMachine: false
  allowElevation: false
  createStartMenuShortcut: true
  shortcutName: Flint
  # Settings and drafts (%APPDATA%\Flint) survive an uninstall; the Flint folder is never touched.
  deleteAppDataOnUninstall: false
  # Removes what the app registered itself: flint:// and the start-with-Windows entry.
  include: resources/installer.nsh
